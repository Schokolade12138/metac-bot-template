name: Check setup

# Manual check that the repository is ready to forecast. It makes no forecasts
# and prints no secrets: only whether the Metaculus token works (and which bot
# account it belongs to) and whether an OpenRouter key is set and what credit it
# has. It reports problems in the log instead of failing the run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Metaculus token
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          if [ -z "$METACULUS_TOKEN" ]; then
            echo "The METACULUS_TOKEN secret is not set"
            exit 0
          fi
          code=$(curl -sS -o me.json -w "%{http_code}" \
            -H "Authorization: Token $METACULUS_TOKEN" \
            https://www.metaculus.com/api/users/me/)
          echo "HTTP $code"
          jq '{id, username, is_bot}' me.json || true
          rm -f me.json

      - name: OpenRouter key
        if: always()
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "The OPENROUTER_API_KEY secret is not set"
            exit 0
          fi
          code=$(curl -sS -o key.json -w "%{http_code}" \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            https://openrouter.ai/api/v1/key)
          echo "HTTP $code"
          jq '.data | {is_free_tier, limit, limit_remaining, usage}' key.json || true
          rm -f key.json
