name: Forecast

# The bot's scheduled run. While bot/settings.py has ACTIVE_PROFILE = "free" this
# only lists the open tournament questions (no forecasts, no LLM calls), which
# shows how reliably the schedule fires. With the paid profile it forecasts every
# open question it has not forecast yet.
on:
  workflow_dispatch:
  schedule:
    - cron: "4-59/10 * * * *" # every 10 minutes, off the busy top of the hour

concurrency:
  group: forecast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bot
        run: uv run python run_bot.py --mode tournament
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
